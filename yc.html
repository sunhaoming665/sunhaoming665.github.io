<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>随机惩罚抽取器</title>
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Press+Start+2P&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/fusion-pixel-12px-monospaced-sc@5.3.0/index.css">
<style>
:root{
  --bg:#0d0221;
  --panel:#1f1235;
  --ink:#f4f1de;
  --green:#39ff14;
  --pink:#ff2d78;
  --yellow:#ffe94a;
  --cyan:#00e5ff;
  --purple:#a06bff;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:'Fusion Pixel 12px Monospaced SC','Press Start 2P',ui-monospace,monospace;
  background:var(--bg);
  color:var(--ink);
  min-height:100vh;
  padding:20px 16px 40px;
  background-image:
    linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:24px 24px;
  overflow-x:hidden;
  display:flex;justify-content:center;
}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:40;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.13) 0 1px,transparent 1px 4px);
  opacity:.35;
}
.container{
  width:100%;max-width:820px;
  background:var(--panel);
  border:4px solid var(--ink);
  box-shadow:8px 8px 0 #000;
  padding:26px;
  margin:16px 0;
  position:relative;z-index:1;
}

/* ===== 标题 ===== */
h1{
  text-align:center;
  color:var(--yellow);
  margin-bottom:14px;
  font-family:'Press Start 2P','Fusion Pixel 12px Monospaced SC',monospace;
  font-size:clamp(1.1rem,4vw,1.7rem);
  letter-spacing:1px;
  text-shadow:3px 3px 0 #9a6b00,5px 5px 0 rgba(0,0,0,.45);
  animation:titleFlicker 5s infinite;
}
@keyframes titleFlicker{
  0%,100%{opacity:1}
  91%{opacity:1}92%{opacity:.55}93%{opacity:1}95%{opacity:.7}96%{opacity:1}
}
.welcome-message{
  text-align:center;margin-bottom:20px;
  color:#c9bce8;font-style:italic;font-size:.9rem;
}

/* ===== 输入区 ===== */
.input-section{margin-bottom:18px}
label{display:block;margin-bottom:8px;font-weight:600;color:var(--ink);font-size:.95rem}
.input-group{display:flex;gap:10px;margin-bottom:12px}
input, textarea{
  flex:1;padding:13px 14px;
  background:var(--bg);border:2px solid #4a3a6e;
  color:var(--ink);font-size:1rem;outline:none;
  font-family:'Fusion Pixel 12px Monospaced SC',monospace;
}
textarea{min-height:110px;resize:vertical}
input:focus, textarea:focus{border-color:var(--purple)}
button{
  background:var(--purple);color:#000;
  border:2px solid #000;box-shadow:3px 3px 0 #000;
  padding:13px 20px;cursor:pointer;
  font-family:'Fusion Pixel 12px Monospaced SC',monospace;
  font-size:.95rem;font-weight:600;
  transition:transform .1s steps(2),box-shadow .1s steps(2);
  min-height:44px;
}
button:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 #000}
button:active{transform:translate(1px,1px);box-shadow:1px 1px 0 #000}

/* ===== 惩罚列表 ===== */
.punishments-section{
  max-height:0;overflow:hidden;transition:max-height .35s ease-out;
}
.punishments-section.expanded{max-height:420px}
.punishments-list{
  border:2px solid #4a3a6e;border-radius:0;
  padding:14px;min-height:140px;max-height:300px;overflow-y:auto;
  background:var(--bg);margin-top:8px;
}
.punishment-item{
  padding:10px 14px;margin-bottom:8px;
  background:var(--panel);
  border:2px solid #4a3a6e;border-left:4px solid var(--purple);
  display:flex;justify-content:space-between;align-items:center;
  font-size:.92rem;line-height:1.6;
}
.punishment-item:last-child{margin-bottom:0}
.punishment-item small{color:var(--green);margin-left:6px;font-size:.8rem}
.remove-btn{background:var(--pink);padding:6px 12px;font-size:.8rem;margin-left:10px}

/* ===== 按钮区 ===== */
.buttons-section{display:flex;gap:14px;margin:18px 0}
.pick-btn{
  flex:2;
  background:var(--green);font-size:1.05rem;
  padding:16px;
}
.clear-btn{
  flex:1;
  background:var(--pink);
}
.toggle-list-btn{
  width:100%;margin-bottom:14px;
  background:var(--purple);
}

/* ===== 结果区 ===== */
.result-section{
  text-align:center;padding:22px 16px;
  background:var(--bg);
  border:3px solid var(--yellow);
  box-shadow:5px 5px 0 #000;
  margin-top:18px;min-height:150px;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  position:relative;overflow:hidden;
}
.result-label{font-size:1rem;color:var(--yellow);margin-bottom:12px;letter-spacing:1px}
.result{
  font-size:1.25rem;font-weight:700;
  color:var(--ink);
  min-height:2.2rem;text-align:center;
  padding:12px 18px;
  background:rgba(255,255,255,.07);
  width:92%;
  line-height:1.7;
}
.empty-message{color:#8a76b8;font-style:italic;text-align:center;padding:20px}
.count-display{
  position:absolute;top:8px;right:10px;
  background:var(--purple);color:#000;
  padding:4px 10px;
  font-family:'Press Start 2P',monospace;font-size:.6rem;
}

/* ===== 动画 ===== */
.flash{animation:flash .3s}
@keyframes flash{0%{opacity:1}50%{opacity:.3}100%{opacity:1}}
.rapid-flash{animation:rapidFlash .1s infinite}
@keyframes rapidFlash{0%{opacity:1}50%{opacity:.2}100%{opacity:1}}
.winner{animation:winner 1s ease-in-out}
@keyframes winner{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
.confetti{
  position:absolute;width:10px;height:10px;background-color:#f00;
  opacity:.7;animation:confettiFall 3s linear forwards;
}
@keyframes confettiFall{
  0%{transform:translateY(-100px) rotate(0deg);opacity:1}
  100%{transform:translateY(500px) rotate(360deg);opacity:0}
}
.fade-in{animation:fadeIn .5s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ===== 通知 ===== */
.notification{
  position:fixed;top:20px;right:20px;z-index:100;
  padding:12px 20px;color:#000;font-weight:600;
  box-shadow:4px 4px 0 #000;
  font-size:.9rem;
}
.notification.success{background:var(--green);border:2px solid #000}
.notification.error{background:var(--pink);border:2px solid #000}

@media (max-width:600px){
  .container{padding:18px 14px}
  h1{font-size:1.15rem}
  .input-group{flex-direction:column}
  .buttons-section{flex-direction:column}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>
<div class="container">
  <h1>随机惩罚抽取器</h1>

  <div class="welcome-message">
    已加载预设惩罚内容，可直接抽取！也可添加自定义惩罚。
  </div>

  <div class="input-section">
    <label for="punishment-input">输入惩罚内容:</label>
    <div class="input-group">
      <input type="text" id="punishment-input" placeholder="例如: 唱一首歌">
      <button id="add-btn">添加惩罚</button>
    </div>
  </div>

  <div class="input-section">
    <label for="batch-input">批量输入惩罚内容（每行一个）:</label>
    <textarea id="batch-input" placeholder="例如:&#10;唱一首歌&#10;做10个俯卧撑&#10;讲一个笑话"></textarea>
    <button id="batch-add-btn" style="margin-top:10px;width:100%">批量添加</button>
  </div>

  <button class="toggle-list-btn" id="toggle-list-btn">显示惩罚列表</button>

  <div class="punishments-section" id="punishments-section">
    <label>当前惩罚列表:</label>
    <div class="count-display" id="count-display">0 项</div>
    <div class="punishments-list" id="punishments-list">
      <div class="empty-message">暂无惩罚，请添加惩罚内容</div>
    </div>
  </div>

  <div class="buttons-section">
    <button class="pick-btn" id="pick-btn">随机抽取惩罚</button>
    <button class="clear-btn" id="clear-btn">清空自定义项</button>
  </div>

  <div class="result-section" id="result-section">
    <div class="result-label">抽取结果:</div>
    <div class="result" id="result"></div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  // 获取DOM元素
  const punishmentInput = document.getElementById('punishment-input');
  const addBtn = document.getElementById('add-btn');
  const batchInput = document.getElementById('batch-input');
  const batchAddBtn = document.getElementById('batch-add-btn');
  const punishmentsList = document.getElementById('punishments-list');
  const punishmentsSection = document.getElementById('punishments-section');
  const toggleListBtn = document.getElementById('toggle-list-btn');
  const pickBtn = document.getElementById('pick-btn');
  const clearBtn = document.getElementById('clear-btn');
  const result = document.getElementById('result');
  const resultSection = document.getElementById('result-section');
  const countDisplay = document.getElementById('count-display');

  const defaultPunishments = [
    "海底捞暖场王：为一位同学激情献唱《生日祝福歌》。",
    "大名腚腚：背对大家，用屁股在空中写出某位同学的名字，要让别人能看出来。",
    "偶像练习生：平板支撑并大声唱歌1分钟。",
    "我是瓯壮壮：俯卧撑30个并一直大喊：'我是瓯中第一猛男'。",
    "金牌销售：把自己当成一件商品，现场口播1分钟的广告来推销自己，要充满激情。",
    "王老师模仿大赛：模仿一位老师或同学的经典动作或说话方式，直到大家猜出来是谁。",
    "演员的自我修养：演一段经典电影桥段，例如《泰坦尼克号》船头飞翔，但需要自己配台词和风声。",
    "瓯中第一深情：选择墙上的一个点（比如一个插座），对它深情地说1分钟情话。",
    "模仿高雅人士舞蹈60s",
    "灵魂画手：闭眼，在30秒内画出指定同学的长相，然后让大家猜画的是谁。",
    "表情包连续剧：做一套连续的五连拍表情包，每个表情要像微信表情那样夸张（如：微笑→大笑→笑哭→崩溃→假笑）。",
    "无声喜剧人：不能说话，只用肢体和拟声词（如“哔哔”“咚咚”）表演一个生活场景，例如“上厕所没纸了”或“打蚊子”。",
    "反串秀：用完全相反性别的方式走一段T台秀，并摆三个经典pose。",
    "普通话推广大使：用标准且缓慢的播音腔，朗读一段方言版绕口令（由现场同学提供），必须不笑场。",
    "冷场王：讲一个自己觉得最好笑的笑话，如果现场无人笑，需做5个波比跳；如果有人笑，则笑的人陪做3个。",
    "MV主角：任选一首歌，一边唱一边模仿该歌曲原MV里的所有动作（哪怕只是站着晃）。"
  ];

  // 惩罚数组（初始化为预设惩罚）
  let punishments = [...defaultPunishments];
  let isListExpanded = false;

  // 初始化显示
  updatePunishmentsDisplay();

  // 切换惩罚列表显示/隐藏
  toggleListBtn.addEventListener('click', function() {
    isListExpanded = !isListExpanded;
    punishmentsSection.classList.toggle('expanded', isListExpanded);
    toggleListBtn.textContent = isListExpanded ? '隐藏惩罚列表' : '显示惩罚列表';
  });

  // 添加单个惩罚
  function addPunishment() {
    const punishmentText = punishmentInput.value.trim();

    if (punishmentText) {
      punishments.push(punishmentText);
      updatePunishmentsDisplay();
      punishmentInput.value = '';
      punishmentInput.focus();
      showNotification('惩罚已添加！');
    } else {
      showNotification('请输入惩罚内容', true);
    }
  }

  // 批量添加惩罚
  function addBatchPunishments() {
    const batchText = batchInput.value.trim();

    if (batchText) {
      const newPunishments = batchText.split('\n')
        .map(p => p.trim())
        .filter(p => p.length > 0);

      if (newPunishments.length > 0) {
        punishments = [...punishments, ...newPunishments];
        updatePunishmentsDisplay();
        batchInput.value = '';
        showNotification(`成功添加 ${newPunishments.length} 个惩罚`);
      } else {
        showNotification('请输入有效的惩罚内容', true);
      }
    } else {
      showNotification('请输入惩罚内容', true);
    }
  }

  // 更新惩罚列表显示
  function updatePunishmentsDisplay() {
    countDisplay.textContent = `${punishments.length} 项`;

    if (punishments.length === 0) {
      punishmentsList.innerHTML = '<div class="empty-message">暂无惩罚，请添加惩罚内容</div>';
      return;
    }

    punishmentsList.innerHTML = '';
    punishments.forEach((punishment, index) => {
      const punishmentItem = document.createElement('div');
      punishmentItem.className = 'punishment-item fade-in';

      // 标记预设惩罚（不可删除）
      const isDefault = index < defaultPunishments.length &&
                       punishment === defaultPunishments[index];

      punishmentItem.innerHTML = `
        <span>${index + 1}. ${punishment} ${isDefault ? '<small>(预设)</small>' : ''}</span>
        ${!isDefault ? `<button class="remove-btn" data-index="${index}">删除</button>` : ''}
      `;
      punishmentsList.appendChild(punishmentItem);
    });

    // 添加删除事件监听（只对非预设惩罚有效）
    document.querySelectorAll('.remove-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        const index = parseInt(this.getAttribute('data-index'));
        punishments.splice(index, 1);
        updatePunishmentsDisplay();
        showNotification('惩罚已删除');
      });
    });
  }

  // 显示通知消息
  function showNotification(message, isError = false) {
    // 移除已有的通知
    const existingNotification = document.querySelector('.notification');
    if (existingNotification) {
      existingNotification.remove();
    }

    // 创建新通知
    const notification = document.createElement('div');
    notification.className = `notification ${isError ? 'error' : 'success'}`;
    notification.textContent = message;

    document.body.appendChild(notification);

    // 3秒后自动移除
    setTimeout(() => {
      notification.remove();
    }, 3000);
  }

  // 创建彩色纸屑效果
  function createConfetti() {
    const colors = ['#39ff14', '#ff2d78', '#ffe94a', '#00e5ff', '#a06bff'];
    for (let i = 0; i < 50; i++) {
      const confetti = document.createElement('div');
      confetti.className = 'confetti';
      confetti.style.left = Math.random() * 100 + '%';
      confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      confetti.style.animationDelay = Math.random() * 2 + 's';
      confetti.style.width = Math.random() * 10 + 5 + 'px';
      confetti.style.height = Math.random() * 10 + 5 + 'px';
      resultSection.appendChild(confetti);

      // 动画结束后移除元素
      setTimeout(() => {
        if (confetti.parentNode) {
          confetti.remove();
        }
      }, 3000);
    }
  }

  // 随机抽取惩罚
  function pickPunishment() {
    if (punishments.length === 0) {
      showNotification('惩罚列表为空，请先添加惩罚', true);
      return;
    }

    // 禁用按钮防止重复点击
    pickBtn.disabled = true;
    clearBtn.disabled = true;

    // 清空结果区域
    result.textContent = '';
    resultSection.querySelectorAll('.confetti').forEach(c => {
      if (c.parentNode) c.remove();
    });

    // 开始闪动效果
    resultSection.classList.add('rapid-flash');

    // 模拟随机选择过程
    let count = 0;
    const maxCount = 30;
    const interval = setInterval(() => {
      const randomIndex = Math.floor(Math.random() * punishments.length);
      result.textContent = punishments[randomIndex];
      result.classList.add('flash');

      setTimeout(() => {
        result.classList.remove('flash');
      }, 150);

      count++;
      if (count >= maxCount) {
        clearInterval(interval);

        // 停止闪动
        resultSection.classList.remove('rapid-flash');

        // 最终结果
        const finalIndex = Math.floor(Math.random() * punishments.length);
        result.textContent = punishments[finalIndex];
        result.classList.add('winner');

        // 添加庆祝效果
        createConfetti();

        // 重新启用按钮
        setTimeout(() => {
          pickBtn.disabled = false;
          clearBtn.disabled = false;
          result.classList.remove('winner');
        }, 2000);
      }
    }, 100);
  }

  // 清空惩罚列表（保留预设惩罚）
  function clearPunishments() {
    if (punishments.length <= defaultPunishments.length) {
      showNotification('惩罚列表已经是初始状态', true);
      return;
    }

    if (confirm('确定要清空所有自定义惩罚吗？（预设惩罚将保留）')) {
      // 只保留预设惩罚
      punishments = [...defaultPunishments];
      updatePunishmentsDisplay();
      result.textContent = '';
      resultSection.querySelectorAll('.confetti').forEach(c => {
        if (c.parentNode) c.remove();
      });
      showNotification('已清空所有自定义惩罚');
    }
  }

  // 事件监听
  addBtn.addEventListener('click', addPunishment);
  punishmentInput.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
      addPunishment();
    }
  });

  batchAddBtn.addEventListener('click', addBatchPunishments);
  pickBtn.addEventListener('click', pickPunishment);
  clearBtn.addEventListener('click', clearPunishments);
});
</script>
</body>
</html>
