<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机数生成器</title>
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #4f46e5;
            --success: #22c55e;
            --error: #ef4444;
            --text: #1e293b;
            --bg: linear-gradient(135deg, #f8fafc, #e2e8f0);
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--bg);
            margin: 0;
            line-height: 1.6;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 2.5rem;
            border-radius: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            width: min(90%, 400px);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        h2 {
            color: var(--primary);
            font-size: 1.875rem;
            margin-bottom: 2rem;
            position: relative;
            text-align: center;
        }

        h2::after {
            content: '';
            position: absolute;
            bottom: -0.5rem;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background: var(--primary);
            border-radius: 2px;
        }

        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text);
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 0.875rem;
            border: 2px solid #e2e8f0;
            border-radius: 0.75rem;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        button {
            width: 100%;
            padding: 1rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        button:hover:not(:disabled) {
            background: var(--secondary);
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
        }

        button::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.3s, height 0.3s;
        }

        button:active:not(:disabled)::after {
            width: 200px;
            height: 200px;
        }

        #result {
            margin-top: 2rem;
            padding: 1.25rem;
            border-radius: 0.75rem;
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            opacity: 0;
            transform: translateY(10px);
        }

        .result-success {
            background: rgba(34, 197, 94, 0.1);
            color: var(--success);
            animation: popIn 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55) forwards;
        }

        .result-error {
            background: rgba(239, 68, 68, 0.1);
            color: var(--error);
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) forwards;
        }

        .validation-message {
            color: var(--error);
            font-size: 0.875rem;
            padding: 0.25rem 0;
            height: 0;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .validation-visible {
            height: auto;
            opacity: 1;
            animation: slideDown 0.3s ease;
        }

        .seed-explanation {
            margin-top: 0.5rem;
            font-size: 0.875rem;
            color: #64748b;
            background-color: #f8fafc;
            padding: 0.75rem;
            border-radius: 0.5rem;
            border-left: 3px solid var(--primary);
        }

        .seed-details {
            margin-top: 0.5rem;
            font-size: 0.875rem;
            color: #64748b;
        }

        .seed-value {
            font-weight: 600;
            color: var(--primary);
        }

        .info-icon {
            position: absolute;
            right: 10px;
            top: 40px;
            cursor: pointer;
            color: #94a3b8;
            transition: color 0.3s;
        }

        .info-icon:hover {
            color: var(--primary);
        }

        .seed-explanation-container {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .seed-explanation-container.expanded {
            max-height: 200px;
        }

        .latency-info {
            display: block;
            font-size: 0.875rem;
            color: #64748b;
            text-align: center;
            margin-top: 0.5rem;
        }

        .latency-value {
            font-weight: 600;
            color: var(--primary);
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes popIn {
            0% { transform: scale(0.8) translateY(10px); opacity: 0; }
            50% { transform: scale(1.1) translateY(0); }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        @keyframes shake {
            0%,100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        @keyframes slideDown {
            from { transform: translateY(-5px); }
            to { transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1.5rem;
                border-radius: 1rem;
            }
            h2 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>随机数生成器</h2>
        
        <div class="form-group" id="seedGroup">
            <label for="seed">🎲 随机种子</label>
            <input type="text" id="seed" placeholder="自动生成" readonly>
            <div class="info-icon" id="infoIcon">?</div>
            <div class="seed-explanation-container" id="seedExplanation">
                <div class="seed-explanation">
                    随机种子是生成随机数的起点值。我们结合了时间戳、网络延迟和加密随机性来确保高随机性。您无需手动输入，系统会自动生成。
                </div>
            </div>
        </div>
        
        <div class="form-group">
            <label for="min">最小值</label>
            <input type="number" id="min" value="1">
            <div class="validation-message" id="minError"></div>
        </div>
        
        <div class="form-group">
            <label for="max">最大值</label>
            <input type="number" id="max" value="46">
            <div class="validation-message" id="maxError"></div>
        </div>
        
        <button onclick="generateRandom()" id="generateBtn">
            <span id="spinner"></span>
            <span id="btnText">生成随机数</span>
        </button>
        
        <div id="result"></div>
        <div id="latencyInfo" class="latency-info"></div>
    </div>

    <script>
        // DOM 元素
        const minInput = document.getElementById('min');
        const maxInput = document.getElementById('max');
        const resultDiv = document.getElementById('result');
        const generateBtn = document.getElementById('generateBtn');
        const seedInput = document.getElementById('seed');
        const infoIcon = document.getElementById('infoIcon');
        const seedExplanation = document.getElementById('seedExplanation');
        const minError = document.getElementById('minError');
        const maxError = document.getElementById('maxError');
        const latencyInfo = document.getElementById('latencyInfo');
        const btnText = document.getElementById('btnText');
        const spinner = document.getElementById('spinner');

        // 验证输入
        function validateInputs() {
            const min = parseInt(minInput.value);
            const max = parseInt(maxInput.value);
            let isValid = true;

            // 重置错误信息
            minError.textContent = '';
            minError.classList.remove('validation-visible');
            maxError.textContent = '';
            maxError.classList.remove('validation-visible');

            // 验证最小值
            if (isNaN(min)) {
                minError.textContent = '请输入有效的数字';
                minError.classList.add('validation-visible');
                isValid = false;
            }

            // 验证最大值
            if (isNaN(max)) {
                maxError.textContent = '请输入有效的数字';
                maxError.classList.add('validation-visible');
                isValid = false;
            }

            // 验证范围
            if (isValid && min >= max) {
                maxError.textContent = '最大值必须大于最小值';
                maxError.classList.add('validation-visible');
                isValid = false;
            }

            return isValid;
        }

        // 测量网络延迟
        async function measureLatency() {
            const startTime = performance.now();
            
            try {
                const response = await fetch('https://s41.ax1x.com/2025/12/31/pZNlY4A.png' + new Date().getTime(), {
                    method: 'HEAD',
                    mode: 'no-cors',
                    cache: 'no-cache'
                });
                
                const latency = performance.now() - startTime;
                return latency;
            } catch (error) {
                // 如果 ping 腾讯失败，尝试 ping Google
                try {
                    const startTime2 = performance.now();
                    await fetch('https://www.google.com/favicon.ico?' + new Date().getTime(), {
                        method: 'HEAD',
                        mode: 'no-cors',
                        cache: 'no-cache'
                    });
                    return performance.now() - startTime2;
                } catch (e) {
                    // 如果都失败，使用当前时间戳的微秒部分
                    return performance.now() % 1000;
                }
            }
        }

        // 生成高质量的随机种子
        async function generateSeed() {
            // 组合多个随机源
            const timePart = Date.now() % 1000000;
            const latency = await measureLatency();
            const latencyPart = latency % 1000;
            
            // 使用浏览器内置的加密API生成随机字节
            const cryptoArray = new Uint32Array(1);
            window.crypto.getRandomValues(cryptoArray);
            const cryptoPart = cryptoArray[0] % 1000000;
            
            // 合并所有部分
            const seed = (timePart + latencyPart + cryptoPart) % 1000000;
            return Math.floor(seed);
        }

        // 基于种子生成随机数
        function generateRandomFromSeed(seed, min, max) {
            // 使用简单的线性同余生成器，但种子是高质量的
            const a = 1664525;
            const c = 1013904223;
            const m = Math.pow(2, 32);
            
            // 生成基于种子的随机数
            seed = (a * seed + c) % m;
            
            // 转换为指定范围
            const normalized = seed / m;
            return Math.floor(normalized * (max - min + 1)) + min;
        }

        // 主生成函数
        async function generateRandom() {
            // 验证输入
            if (!validateInputs()) {
                return;
            }

            const min = parseInt(minInput.value);
            const max = parseInt(maxInput.value);
            
            // 禁用按钮并显示加载状态
            generateBtn.disabled = true;
            btnText.textContent = '正在生成...';
            spinner.innerHTML = '<div class="loading-spinner"></div>';
            
            try {
                // 显示网络延迟测量中
                latencyInfo.innerHTML = '正在测量网络延迟以增加随机性...';
                
                // 生成随机种子
                const seed = await generateSeed();
                seedInput.value = `S${seed.toString().padStart(6, '0')}`;
                
                // 显示延迟信息
                const latency = await measureLatency();
                latencyInfo.innerHTML = `网络延迟: <span class="latency-value">${latency.toFixed(2)}ms</span> | 种子: <span class="latency-value">${seedInput.value}</span>`;
                
                // 生成最终随机数
                const randomNumber = generateRandomFromSeed(seed, min, max);
                
                // 显示结果
                resultDiv.textContent = randomNumber;
                resultDiv.className = 'result-success';
                resultDiv.style.opacity = 1;
                resultDiv.style.transform = 'translateY(0)';
                
            } catch (error) {
                // 出错时回退到简单随机数
                console.error('生成随机数时出错:', error);
                const fallbackSeed = Date.now() + performance.now();
                const fallbackRandom = generateRandomFromSeed(fallbackSeed, min, max);
                
                seedInput.value = 'F' + fallbackSeed.toString().slice(-6);
                latencyInfo.textContent = '使用备用随机数生成方法';
                
                resultDiv.textContent = fallbackRandom;
                resultDiv.className = 'result-success';
                resultDiv.style.opacity = 1;
                resultDiv.style.transform = 'translateY(0)';
            } finally {
                // 恢复按钮状态
                generateBtn.disabled = false;
                btnText.textContent = '生成随机数';
                spinner.innerHTML = '';
            }
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 自动生成初始种子
            generateSeed().then(seed => {
                seedInput.value = `S${seed.toString().padStart(6, '0')}`;
            });
            
            // 点击问号图标显示/隐藏说明
            infoIcon.addEventListener('click', function() {
                seedExplanation.classList.toggle('expanded');
            });
            
            // 监听输入变化
            [minInput, maxInput].forEach(input => {
                input.addEventListener('input', function() {
                    // 输入时清除之前的错误提示
                    const errorDiv = input.id === 'min' ? minError : maxError;
                    errorDiv.textContent = '';
                    errorDiv.classList.remove('validation-visible');
                    
                    // 清除结果
                    resultDiv.textContent = '';
                    resultDiv.className = '';
                    resultDiv.style.opacity = 0;
                });
            });
            
            // 按回车键触发生成
            document.addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && !generateBtn.disabled) {
                    generateRandom();
                }
            });
        });
    </script>
</body>
</html>
