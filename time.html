<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>北京时间与倒计时</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1a1a, #4a4a4a);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Arial, sans-serif;
            padding: 20px;
            flex-direction: column;
        }

        .clock-container {
            background: rgba(255, 255, 255, 0.1);
            padding: 4rem 6rem;
            border-radius: 25px;
            box-shadow: 
                0 25px 45px rgba(0,0,0,0.25),
                0 8px 15px rgba(0,0,0,0.15);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
            width: 100%;
            max-width: 800px;
            position: relative;
            margin-bottom: 20px;
        }

        .mode-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            width: 100%;
            max-width: 800px;
        }

        .mode-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #f0f0f0;
            padding: 6px 12px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s ease;
        }

        .mode-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .mode-btn.active {
            background: rgba(0, 255, 157, 0.3);
            border-color: rgba(0, 255, 157, 0.5);
        }

        .countdown-setup {
            display: none;
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            text-align: center;
        }

        .countdown-setup h3 {
            color: #f0f0f0;
            margin-bottom: 15px;
            font-size: 1.5rem;
        }

        .countdown-type-selector {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .countdown-type {
            display: flex;
            align-items: center;
            color: #f0f0f0;
            cursor: pointer;
        }

        .countdown-type input {
            margin-right: 8px;
        }

        .time-inputs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .time-input {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .time-input label {
            color: #f0f0f0;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .time-input input {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #f0f0f0;
            padding: 8px;
            border-radius: 5px;
            width: 80px;
            text-align: center;
            font-size: 1.2rem;
        }

        .time-picker {
            display: none;
            flex-direction: column;
            align-items: center;
            margin-bottom: 15px;
        }

        .time-picker label {
            color: #f0f0f0;
            margin-bottom: 8px;
            font-size: 1rem;
        }

        .time-picker input {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #f0f0f0;
            padding: 10px;
            border-radius: 5px;
            font-size: 1.2rem;
            width: 150px;
            text-align: center;
        }

        .start-btn {
            background: rgba(0, 255, 157, 0.3);
            border: 1px solid rgba(0, 255, 157, 0.5);
            color: #f0f0f0;
            padding: 10px 25px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .start-btn:hover {
            background: rgba(0, 255, 157, 0.5);
        }

        .date {
            color: #f0f0f0;
            font-size: 2.4rem;
            text-align: center;
            margin-bottom: 2rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            letter-spacing: 1px;
        }

        .time {
            color: #00ff9d;
            font-size: 5rem;
            font-weight: 700;
            text-align: center;
            letter-spacing: 3px;
            text-shadow: 0 0 15px rgba(0, 255, 157, 0.5);
            padding: 1rem 2rem;
            border-radius: 12px;
            background: rgba(255,255,255,0.03);
        }

        .countdown-message {
            color: #f0f0f0;
            font-size: 1.5rem;
            text-align: center;
            margin-top: 1rem;
            min-height: 2rem;
        }

        @media (max-width: 768px) {
            .clock-container {
                padding: 3rem;
                width: 90%;
            }
            .date {
                font-size: 2rem;
            }
            .time {
                font-size: 3.6rem;
            }
            .mode-controls {
                position: static;
                justify-content: center;
                margin-bottom: 20px;
            }
            .countdown-type-selector {
                flex-direction: column;
                gap: 10px;
            }
        }

        @media (max-width: 480px) {
            .date {
                font-size: 1.8rem;
            }
            .time {
                font-size: 3rem;
            }
            .time-inputs {
                flex-direction: column;
                align-items: center;
            }
            .mode-btn {
                padding: 5px 10px;
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="clock-container">
        <div class="countdown-setup" id="countdownSetup">
            <h3>设置倒计时</h3>
            
            <div class="countdown-type-selector">
                <div class="countdown-type">
                    <input type="radio" id="durationType" name="countdownType" value="duration" checked>
                    <label for="durationType">时长倒计时</label>
                </div>
                <div class="countdown-type">
                    <input type="radio" id="timeType" name="countdownType" value="time">
                    <label for="timeType">指定时间点</label>
                </div>
            </div>
            
            <div class="time-inputs" id="durationInputs">
                <div class="time-input">
                    <label for="hoursInput">小时</label>
                    <input type="number" id="hoursInput" min="0" max="23" value="0">
                </div>
                <div class="time-input">
                    <label for="minutesInput">分钟</label>
                    <input type="number" id="minutesInput" min="0" max="59" value="0">
                </div>
                <div class="time-input">
                    <label for="secondsInput">秒</label>
                    <input type="number" id="secondsInput" min="0" max="59" value="10">
                </div>
            </div>
            
            <div class="time-picker" id="timePicker">
                <label for="targetTimeInput">选择结束时间</label>
                <input type="time" id="targetTimeInput">
            </div>
            
            <button class="start-btn" id="startCountdown">开始倒计时</button>
        </div>
        
        <div class="date" id="dateDisplay"></div>
        <div class="time" id="timeDisplay"></div>
        <div class="countdown-message" id="countdownMessage"></div>
    </div>
    
    <div class="mode-controls">
        <button class="mode-btn active" id="clockModeBtn">时钟模式</button>
        <button class="mode-btn" id="countdownModeBtn">倒计时模式</button>
    </div>

    <script>
        const weekDays = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
        let currentMode = 'clock'; // 'clock' 或 'countdown'
        let countdownInterval = null;
        let countdownEndTime = null;
        let returnToClockTimeout = null;
        
        const clockModeBtn = document.getElementById('clockModeBtn');
        const countdownModeBtn = document.getElementById('countdownModeBtn');
        const countdownSetup = document.getElementById('countdownSetup');
        const hoursInput = document.getElementById('hoursInput');
        const minutesInput = document.getElementById('minutesInput');
        const secondsInput = document.getElementById('secondsInput');
        const targetTimeInput = document.getElementById('targetTimeInput');
        const durationInputs = document.getElementById('durationInputs');
        const timePicker = document.getElementById('timePicker');
        const startCountdownBtn = document.getElementById('startCountdown');
        const dateDisplay = document.getElementById('dateDisplay');
        const timeDisplay = document.getElementById('timeDisplay');
        const countdownMessage = document.getElementById('countdownMessage');
        const durationTypeRadio = document.getElementById('durationType');
        const timeTypeRadio = document.getElementById('timeType');
        
        // 切换倒计时类型
        function toggleCountdownType() {
            if (durationTypeRadio.checked) {
                durationInputs.style.display = 'flex';
                timePicker.style.display = 'none';
            } else {
                durationInputs.style.display = 'none';
                timePicker.style.display = 'flex';
                
                // 设置默认时间为当前时间+1小时
                const now = new Date();
                now.setHours(now.getHours() + 1);
                targetTimeInput.value = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
            }
        }
        
        // 切换模式
        function switchMode(mode) {
            currentMode = mode;
            
            if (mode === 'clock') {
                // 切换到时钟模式
                clockModeBtn.classList.add('active');
                countdownModeBtn.classList.remove('active');
                countdownSetup.style.display = 'none';
                countdownMessage.textContent = '';
                
                // 清除倒计时相关计时器
                if (countdownInterval) {
                    clearInterval(countdownInterval);
                    countdownInterval = null;
                }
                
                if (returnToClockTimeout) {
                    clearTimeout(returnToClockTimeout);
                    returnToClockTimeout = null;
                }
                
                // 立即更新时间显示
                updateDateTime();
            } else {
                // 切换到倒计时模式
                clockModeBtn.classList.remove('active');
                countdownModeBtn.classList.add('active');
                countdownSetup.style.display = 'block';
                timeDisplay.textContent = '00:00:00';
                dateDisplay.textContent = '倒计时模式';
                
                // 确保正确的输入类型显示
                toggleCountdownType();
            }
        }
        
        // 更新日期和时间显示
        function updateDateTime() {
            const now = new Date();
            
            const dateStr = `${now.getFullYear()}年
                ${(now.getMonth() + 1).toString().padStart(2, '0')}月
                ${now.getDate().toString().padStart(2, '0')}日 
                ${weekDays[now.getDay()]}
            `.replace(/\s+/g, ' ');

            const timeStr = [
                now.getHours().toString().padStart(2, '0'),
                now.getMinutes().toString().padStart(2, '0'),
                now.getSeconds().toString().padStart(2, '0')
            ].join(':');

            dateDisplay.textContent = dateStr;
            timeDisplay.textContent = timeStr;
        }
        
        // 开始倒计时
        function startCountdown() {
            let totalSeconds = 0;
            let endTime = null;
            
            if (durationTypeRadio.checked) {
                // 时长倒计时
                const hours = parseInt(hoursInput.value) || 0;
                const minutes = parseInt(minutesInput.value) || 0;
                const seconds = parseInt(secondsInput.value) || 0;
                
                // 计算总秒数
                totalSeconds = hours * 3600 + minutes * 60 + seconds;
                
                if (totalSeconds <= 0) {
                    alert('请设置有效的倒计时时间！');
                    return;
                }
                
                // 设置结束时间
                endTime = new Date(Date.now() + totalSeconds * 1000);
            } else {
                // 指定时间点倒计时
                const targetTime = targetTimeInput.value;
                if (!targetTime) {
                    alert('请选择结束时间！');
                    return;
                }
                
                const [hours, minutes] = targetTime.split(':').map(Number);
                const now = new Date();
                endTime = new Date(now);
                endTime.setHours(hours, minutes, 0, 0);
                
                // 如果选择的时间已经过去，则设置为明天的同一时间
                if (endTime <= now) {
                    endTime.setDate(endTime.getDate() + 1);
                }
                
                totalSeconds = Math.floor((endTime - now) / 1000);
                
                if (totalSeconds <= 0) {
                    alert('请选择未来的时间！');
                    return;
                }
            }
            
            // 隐藏设置界面
            countdownSetup.style.display = 'none';
            
            // 设置结束时间
            countdownEndTime = endTime;
            
            // 更新倒计时显示
            updateCountdownDisplay();
            
            // 启动倒计时
            countdownInterval = setInterval(updateCountdownDisplay, 1000);
        }
        
        // 更新倒计时显示
        function updateCountdownDisplay() {
            const now = new Date();
            const diff = countdownEndTime - now;
            
            if (diff <= 0) {
                // 倒计时结束
                clearInterval(countdownInterval);
                countdownInterval = null;
                
                timeDisplay.textContent = '00:00:00';
                timeDisplay.style.color = '#ff5555';
                countdownMessage.textContent = '倒计时结束！30秒后自动返回时钟模式';
                
                // 设置30秒后自动返回时钟模式
                returnToClockTimeout = setTimeout(() => {
                    switchMode('clock');
                    timeDisplay.style.color = '#00ff9d';
                }, 30000);
                
                return;
            }
            
            // 计算剩余时间
            const hours = Math.floor(diff / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            
            // 更新显示
            timeDisplay.textContent = [
                hours.toString().padStart(2, '0'),
                minutes.toString().padStart(2, '0'),
                seconds.toString().padStart(2, '0')
            ].join(':');
            
            // 动态改变颜色，最后10秒变红色
            if (hours === 0 && minutes === 0 && seconds <= 10) {
                timeDisplay.style.color = '#ff5555';
            } else {
                timeDisplay.style.color = '#00ff9d';
            }
        }
        
        // 事件监听
        clockModeBtn.addEventListener('click', () => switchMode('clock'));
        countdownModeBtn.addEventListener('click', () => switchMode('countdown'));
        startCountdownBtn.addEventListener('click', startCountdown);
        durationTypeRadio.addEventListener('change', toggleCountdownType);
        timeTypeRadio.addEventListener('change', toggleCountdownType);
        
        // 初始化
        updateDateTime();
        setInterval(() => {
            if (currentMode === 'clock') {
                updateDateTime();
            }
        }, 1000);
    </script>
</body>
</html>
