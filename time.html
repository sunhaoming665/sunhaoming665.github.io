<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在线时钟</title>
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Press+Start+2P&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/fusion-pixel-12px-monospaced-sc@5.3.0/index.css">
<style>
:root{
  --bg:#0d0221;
  --panel:#1f1235;
  --ink:#f4f1de;
  --green:#39ff14;
  --pink:#ff2d78;
  --yellow:#ffe94a;
  --cyan:#00e5ff;
  --purple:#a06bff;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:'Fusion Pixel 12px Monospaced SC','Press Start 2P',ui-monospace,monospace;
  background:var(--bg);
  color:var(--ink);
  min-height:100vh;
  padding:20px 16px 40px;
  background-image:
    linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:24px 24px;
  overflow-x:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:40;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.13) 0 1px,transparent 1px 4px);
  opacity:.35;
}
.container{max-width:820px;margin:0 auto;position:relative;z-index:1;width:100%}

/* ===== 时钟主体 ===== */
.clock-container{
  background:var(--panel);
  border:4px solid var(--ink);
  box-shadow:8px 8px 0 #000;
  padding:3.2rem 2rem;
  width:100%;
  text-align:center;
  position:relative;
  margin-bottom:16px;
}
.clock-label{
  font-family:'Press Start 2P',monospace;
  font-size:.65rem;color:var(--purple);letter-spacing:2px;
  margin-bottom:1.4rem;
}
.date{
  color:var(--ink);
  font-size:1.7rem;
  text-align:center;
  margin-bottom:1.6rem;
  letter-spacing:1px;
}
.time{
  color:var(--green);
  font-size:clamp(2.8rem,10vw,5rem);
  font-weight:700;
  text-align:center;
  letter-spacing:3px;
  text-shadow:0 0 18px rgba(57,255,20,.45);
  padding:0.8rem 1.2rem;
  font-family:'Press Start 2P','Fusion Pixel 12px Monospaced SC',monospace;
  background:rgba(0,0,0,.35);
  border:2px solid rgba(255,255,255,.12);
}
.countdown-message{
  color:var(--yellow);
  font-size:1.15rem;
  text-align:center;
  margin-top:1rem;
  min-height:2rem;
}

/* ===== 模式切换 ===== */
.mode-controls{
  display:flex;justify-content:center;gap:10px;margin-top:18px;
  flex-wrap:wrap;
}
.mode-btn{
  background:var(--bg);
  border:2px solid #4a3a6e;
  color:var(--ink);
  padding:10px 18px;
  cursor:pointer;
  font-family:'Fusion Pixel 12px Monospaced SC',monospace;
  font-size:.95rem;
  transition:all .1s steps(2);
}
.mode-btn:hover{border-color:var(--cyan)}
.mode-btn.active{
  background:rgba(57,255,20,.18);
  border-color:var(--green);
  color:var(--green);
}

/* ===== 倒计时设置 ===== */
.countdown-setup{
  display:none;
  background:var(--panel);
  border:3px solid var(--ink);
  box-shadow:5px 5px 0 #000;
  padding:22px;
  margin-top:18px;
  text-align:center;
}
.countdown-setup h3{
  color:var(--yellow);
  margin-bottom:14px;
  font-family:'Press Start 2P','Fusion Pixel 12px Monospaced SC',monospace;
  font-size:.95rem;letter-spacing:.5px;
}
.countdown-type-selector{
  display:flex;justify-content:center;gap:20px;margin-bottom:18px;flex-wrap:wrap;
}
.countdown-type{
  display:flex;align-items:center;color:var(--ink);
  cursor:pointer;font-size:.95rem;
}
.countdown-type input{margin-right:8px;accent-color:var(--green);width:16px;height:16px}
.time-inputs{
  display:flex;justify-content:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;
}
.time-input{display:flex;flex-direction:column;align-items:center}
.time-input label{color:var(--ink);margin-bottom:6px;font-size:.9rem}
.time-input input{
  background:var(--bg);
  border:2px solid #4a3a6e;
  color:var(--ink);
  padding:10px;
  width:86px;text-align:center;
  font-family:'Fusion Pixel 12px Monospaced SC',monospace;
  font-size:1.15rem;outline:none;
}
.time-input input:focus{border-color:var(--cyan)}
.time-picker{display:none;flex-direction:column;align-items:center;margin-bottom:14px}
.time-picker label{color:var(--ink);margin-bottom:8px;font-size:1rem}
.time-picker input{
  background:var(--bg);
  border:2px solid #4a3a6e;
  color:var(--ink);
  padding:10px;
  font-family:'Fusion Pixel 12px Monospaced SC',monospace;
  font-size:1.15rem;width:150px;text-align:center;outline:none;
}
.time-picker input:focus{border-color:var(--cyan)}
.start-btn{
  background:rgba(57,255,20,.25);
  border:2px solid var(--green);
  color:var(--green);
  padding:12px 26px;
  cursor:pointer;
  font-family:'Fusion Pixel 12px Monospaced SC',monospace;
  font-size:1rem;margin-top:8px;
  box-shadow:3px 3px 0 #000;
  transition:transform .1s steps(2),box-shadow .1s steps(2);
}
.start-btn:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 #000}
.start-btn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 #000}

@media (max-width:768px){
  .clock-container{padding:2.2rem 1rem}
  .date{font-size:1.4rem}
  .time{font-size:2.6rem}
}
@media (max-width:480px){
  .date{font-size:1.2rem}
  .time{font-size:2rem}
  .time-inputs{flex-direction:column;align-items:center}
  .mode-btn{padding:8px 14px}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>
<div class="container">

  <div class="clock-container">
    <div class="clock-label">-- CLOCK / TIMER --</div>
    <div class="date" id="dateDisplay"></div>
    <div class="time" id="timeDisplay"></div>
    <div class="countdown-message" id="countdownMessage"></div>

    <div class="countdown-setup" id="countdownSetup">
      <h3>设置倒计时</h3>

      <div class="countdown-type-selector">
        <div class="countdown-type">
          <input type="radio" id="durationType" name="countdownType" value="duration" checked>
          <label for="durationType">时长倒计时</label>
        </div>
        <div class="countdown-type">
          <input type="radio" id="timeType" name="countdownType" value="time">
          <label for="timeType">指定时间点</label>
        </div>
      </div>

      <div class="time-inputs" id="durationInputs">
        <div class="time-input">
          <label for="hoursInput">小时</label>
          <input type="number" id="hoursInput" min="0" max="23" value="0">
        </div>
        <div class="time-input">
          <label for="minutesInput">分钟</label>
          <input type="number" id="minutesInput" min="0" max="59" value="0">
        </div>
        <div class="time-input">
          <label for="secondsInput">秒</label>
          <input type="number" id="secondsInput" min="0" max="59" value="0">
        </div>
      </div>

      <div class="time-picker" id="timePicker">
        <label for="targetTimeInput">选择结束时间</label>
        <input type="time" id="targetTimeInput">
      </div>

      <button class="start-btn" id="startCountdown">开始倒计时</button>
    </div>
  </div>

  <div class="mode-controls">
    <button class="mode-btn active" id="clockModeBtn">时钟模式</button>
    <button class="mode-btn" id="countdownModeBtn">倒计时模式</button>
  </div>
</div>

<script>
const weekDays = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
let currentMode = 'clock'; // 'clock' 或 'countdown'
let countdownInterval = null;
let countdownEndTime = null;
let returnToClockTimeout = null;

const clockModeBtn = document.getElementById('clockModeBtn');
const countdownModeBtn = document.getElementById('countdownModeBtn');
const countdownSetup = document.getElementById('countdownSetup');
const hoursInput = document.getElementById('hoursInput');
const minutesInput = document.getElementById('minutesInput');
const secondsInput = document.getElementById('secondsInput');
const targetTimeInput = document.getElementById('targetTimeInput');
const durationInputs = document.getElementById('durationInputs');
const timePicker = document.getElementById('timePicker');
const startCountdownBtn = document.getElementById('startCountdown');
const dateDisplay = document.getElementById('dateDisplay');
const timeDisplay = document.getElementById('timeDisplay');
const countdownMessage = document.getElementById('countdownMessage');
const durationTypeRadio = document.getElementById('durationType');
const timeTypeRadio = document.getElementById('timeType');

// 切换倒计时类型
function toggleCountdownType() {
    if (durationTypeRadio.checked) {
        durationInputs.style.display = 'flex';
        timePicker.style.display = 'none';
    } else {
        durationInputs.style.display = 'none';
        timePicker.style.display = 'flex';

        // 设置默认时间为当前时间
        const now = new Date();
        targetTimeInput.value = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
    }
}

// 切换模式
function switchMode(mode) {
    currentMode = mode;

    if (mode === 'clock') {
        // 切换到时钟模式
        clockModeBtn.classList.add('active');
        countdownModeBtn.classList.remove('active');
        countdownSetup.style.display = 'none';
        countdownMessage.textContent = '';
        timeDisplay.style.color = '#39ff14';

        // 清除倒计时相关计时器
        if (countdownInterval) {
            clearInterval(countdownInterval);
            countdownInterval = null;
        }

        if (returnToClockTimeout) {
            clearTimeout(returnToClockTimeout);
            returnToClockTimeout = null;
        }

        // 立即更新时间显示
        updateDateTime();
    } else {
        // 切换到倒计时模式
        clockModeBtn.classList.remove('active');
        countdownModeBtn.classList.add('active');
        countdownSetup.style.display = 'block';
        timeDisplay.textContent = '00:00:00';
        dateDisplay.textContent = '倒计时模式';
        timeDisplay.style.color = '#39ff14';

        // 确保正确的输入类型显示
        toggleCountdownType();
    }
}

// 更新日期和时间显示
function updateDateTime() {
    const now = new Date();

    const dateStr = `${now.getFullYear()}年
        ${(now.getMonth() + 1).toString().padStart(2, '0')}月
        ${now.getDate().toString().padStart(2, '0')}日 
        ${weekDays[now.getDay()]}
    `.replace(/\s+/g, ' ');

    const timeStr = [
        now.getHours().toString().padStart(2, '0'),
        now.getMinutes().toString().padStart(2, '0'),
        now.getSeconds().toString().padStart(2, '0')
    ].join(':');

    dateDisplay.textContent = dateStr;
    timeDisplay.textContent = timeStr;
}

// 开始倒计时
function startCountdown() {
    let totalSeconds = 0;
    let endTime = null;

    if (durationTypeRadio.checked) {
        // 时长倒计时
        const hours = parseInt(hoursInput.value) || 0;
        const minutes = parseInt(minutesInput.value) || 0;
        const seconds = parseInt(secondsInput.value) || 0;

        // 计算总秒数
        totalSeconds = hours * 3600 + minutes * 60 + seconds;

        if (totalSeconds <= 0) {
            alert('请设置有效的倒计时时间！');
            return;
        }

        // 设置结束时间
        endTime = new Date(Date.now() + totalSeconds * 1000);
    } else {
        // 指定时间点倒计时
        const targetTime = targetTimeInput.value;
        if (!targetTime) {
            alert('请选择结束时间！');
            return;
        }

        const [hours, minutes] = targetTime.split(':').map(Number);
        const now = new Date();
        endTime = new Date(now);
        endTime.setHours(hours, minutes, 0, 0);

        // 如果选择的时间已经过去，则设置为明天的同一时间
        if (endTime <= now) {
            endTime.setDate(endTime.getDate() + 1);
        }

        totalSeconds = Math.floor((endTime - now) / 1000);

        if (totalSeconds <= 0) {
            alert('请选择未来的时间！');
            return;
        }
    }

    // 隐藏设置界面
    countdownSetup.style.display = 'none';

    // 设置结束时间
    countdownEndTime = endTime;

    // 更新倒计时显示
    updateCountdownDisplay();

    // 启动倒计时
    countdownInterval = setInterval(updateCountdownDisplay, 1000);
}

// 更新倒计时显示
function updateCountdownDisplay() {
    const now = new Date();
    const diff = countdownEndTime - now;

    if (diff <= 0) {
        // 倒计时结束
        clearInterval(countdownInterval);
        countdownInterval = null;

        timeDisplay.textContent = '00:00:00';
        timeDisplay.style.color = '#ff2d78';
        countdownMessage.textContent = '倒计时结束！即将自动返回时钟模式';

        // 设置30秒后自动返回时钟模式
        returnToClockTimeout = setTimeout(() => {
            switchMode('clock');
            timeDisplay.style.color = '#39ff14';
        }, 30000);

        return;
    }

    // 计算剩余时间
    const hours = Math.floor(diff / (1000 * 60 * 60));
    const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((diff % (1000 * 60)) / 1000);

    // 更新显示
    timeDisplay.textContent = [
        hours.toString().padStart(2, '0'),
        minutes.toString().padStart(2, '0'),
        seconds.toString().padStart(2, '0')
    ].join(':');
}

// 事件监听
clockModeBtn.addEventListener('click', () => switchMode('clock'));
countdownModeBtn.addEventListener('click', () => switchMode('countdown'));
startCountdownBtn.addEventListener('click', startCountdown);
durationTypeRadio.addEventListener('change', toggleCountdownType);
timeTypeRadio.addEventListener('change', toggleCountdownType);

// 初始化
updateDateTime();
setInterval(() => {
    if (currentMode === 'clock') {
        updateDateTime();
    }
}, 1000);
</script>
</body>
</html>
